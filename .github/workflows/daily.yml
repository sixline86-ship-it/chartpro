# ============================================================
# .github/workflows/daily.yml   (v3 — 텔레그램 알림 + 자동 스케줄)
# 차트프로 관제탑 — 매일 자동 발행 시간표
# ------------------------------------------------------------
#   ① collect_data.py    숫자 수집 (DART·네이버)
#   ② generate_report.py 해석글 생성 (Claude)
#   ③ build_html.py      리포트 HTML 생성
#   ④ 자동 커밋          → GitHub Pages 자동 배포
#   ⑤ notify_telegram.py 텔레그램 알림 전송
# ============================================================
name: 관제탑 일일 발행

on:
  # (1) 수동 실행 버튼 — Actions 탭에서 "Run workflow"
  workflow_dispatch:

  # (2) 자동 실행 시간표 (cron은 UTC 기준! 한국시간 -9시간)
  #     한국 저녁 8시 발행 목표 → 19:30 KST 실행 → UTC 10:30
  schedule:
    - cron: '30 10 * * 1-5'   # 월~금 UTC 10:30 = KST 19:30

permissions:
  contents: write

# ⭐ GitHub 서버는 기본 UTC라 한국보다 9시간 느리다. 한국시간으로 맞춘다.
env:
  TZ: Asia/Seoul

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      # ── ① 숫자 수집 ──
      - name: 데이터 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
        run: python collect_data.py

      # ── ② 해석글 생성 (실패해도 다음 단계로) ──
      - name: 해석글 생성 (Claude)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_report.py

      # ── ③ HTML 생성 ──
      - name: 리포트 HTML 생성
        run: |
          python build_html.py
          cp report_$(date +%Y%m%d).html index.html

      # ── ④ 자동 커밋 → Pages 배포 ──
      - name: 자동 커밋 & 배포
        run: |
          git config user.name "chartpro-bot"
          git config user.email "bot@chartpro.local"
          git add index.html data_*.json report_*.json report_*.html || true
          git commit -m "자동 발행: $(date +%Y-%m-%d)" || echo "변경사항 없음"
          git push

      # ── ⑤ 텔레그램 알림 ──
      - name: 텔레그램 알림 전송
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify_telegram.py
