# ============================================================
# .github/workflows/daily.yml   (v4 — 발행 시각 앞당김 + 지연 대비 재시도)
# 차트프로 관제탑 — 매일 자동 발행 시간표
# ------------------------------------------------------------
#   ① collect_data.py    숫자 수집 (DART·네이버·pykrx)
#   ② generate_report.py 해석글 생성 (Claude)
#   ③ build_html.py      리포트 HTML 생성
#   ④ 자동 커밋          → GitHub Pages 자동 배포
#   ⑤ notify_telegram.py 텔레그램 알림 전송
#
# 🔴 왜 v3에서 9시 반이 넘어서 왔나?
#    파이프라인 실행 자체는 6~8분밖에 안 걸린다(커밋 기록으로 확인).
#    문제는 GitHub의 "예약 실행(schedule)"이 무료 공용 대기열이라
#    정시가 아니라 **1~3시간 늦게** 깨어난 것이다.
#    (특히 UTC 정각·30분은 전 세계 작업이 몰리는 혼잡 시간대)
#
# 🟢 이번 v4의 대응
#    1) 시작 시각을 19:30 → 18:20으로 앞당겨 지연분을 흡수한다
#    2) 혼잡한 정각·30분을 피해 :20 / :45 / :15 같은 어중간한 분에 건다
#    3) 같은 날 4번 시도하고, 한 번 성공하면 나머지는 스스로 건너뛴다
#       → 언제 깨어나든 "그날 가장 이른 시점"에 한 번만 발행된다
# ============================================================
name: 관제탑 일일 발행

on:
  # (1) 수동 실행 버튼 — Actions 탭에서 "Run workflow"
  #     수동 실행은 중복 방지 장치를 무시하고 무조건 다시 만든다(재발행용)
  #
  #     ⚠️ 돈이 드는 건 Claude API 호출뿐이다(1회 약 수백원).
  #        디자인·문구만 고쳐서 확인할 때는 아래 두 옵션을 기본값 그대로 두면
  #        기존 해석글을 재사용하므로 **과금이 0원**이고 텔레그램도 안 나간다.
  workflow_dispatch:
    inputs:
      claude:
        description: 'Claude 해석글'
        type: choice
        # 기본값은 '재사용'(무료). 수동 실행의 대부분이 화면 확인이기 때문이다.
        #
        # ⚠️ 그런데 이게 사고를 냈다 (2026-08-19)
        #    재사용은 해석글을 만들지 않으므로 **핵심편이 비어 있는 HTML**이 나온다.
        #    그런데 예전에는 그 HTML로 index.html까지 덮어쓰고 커밋까지 해버려서,
        #    **라이브 사이트에서 핵심편이 통째로 사라졌다.**
        #
        #    → 기본값은 그대로 '재사용'으로 두되,
        #      아래 '리포트 HTML 생성'과 '자동 커밋' 단계에서
        #      **해석글이 없으면 index.html을 건드리지 않도록** 막았다.
        #      (화면 확인은 report_YYYYMMDD.html로 하면 된다)
        default: '재사용 (무료 — 화면 확인용)'
        options:
          - '재사용 (무료 — 화면 확인용)'
          - '새로 생성 (과금 — 정식 발행용)'
      telegram:
        description: '텔레그램 발송'
        type: choice
        # ⚠️ 기본을 '보냄'으로 둔다 — 수동 실행의 대부분이 정식 재발행이라,
        #    매번 드롭다운을 바꾸다 잊어버려 알림이 안 나가는 일이 잦았다.
        #    화면만 확인할 때는 '보내지 않음'을 골라야 한다.
        default: '보냄 (정식 발행)'
        options:
          - '보냄 (정식 발행)'
          - '보내지 않음 (테스트)'

  # (2) 자동 실행 시간표 (cron은 UTC 기준! 한국시간 = UTC + 9시간)
  # 🔴 2026-08-28 (3차) — GitHub 자체 schedule(cron)을 완전히 없앤다.
  #    HO 지적: "안전망이라고 남겨둔 것도 결국 같은 GitHub 예약 기능이라
  #    똑같이 몇 시간씩 밀릴 수 있잖아. 그럼 안전망이 아니라 그것도 위험한 거네."
  #    — 정확히 맞다. 18:47로 아무리 늦게 잡아도, 이 트리거 자체가 **그날
  #    안에 도는지조차 보장이 안 된다.** 밀리면 다음 날 새벽에 돌아 오늘
  #    겪은 사고(날짜 착각 + 잠정 데이터 + 새벽 알림)를 그대로 반복한다.
  #    "안전망"이라는 이름이 무색하게, 실제로는 소음과 위험만 더했다.
  #
  #    → 타이밍은 이제 **전적으로 cron-job.org(외부, 신뢰 가능)**가 맡는다.
  #      18:07 · 18:27 두 번 찔러도 부족하면, GitHub 예약을 더 넣는 대신
  #      **cron-job.org에 18:47 하나를 더** 만드는 쪽을 권한다 — 똑같이
  #      "한 번 더 찔러보는" 안전망이지만, 이번엔 진짜로 믿을 수 있는 안전망이다.
  #
  #    ⚠️ workflow_dispatch(수동 「Run workflow」 버튼)는 그대로 남긴다.
  #       이건 "예약"이 아니라 "형이 직접 누를 때만 도는 버튼"이라 지연 문제와
  #       무관하고, cron-job.org 셋이 전부 실패한 정말 최악의 날에 형이
  #       직접 개입할 수 있는 유일한 수단이다.

permissions:
  contents: write

# 여러 시도가 동시에 겹쳐 돌지 않게 한 줄로 세운다
concurrency:
  group: chartpro-publish
  cancel-in-progress: false

# ⭐ GitHub 서버는 기본 UTC라 한국보다 9시간 느리다. 한국시간으로 맞춘다.
env:
  TZ: Asia/Seoul
  # 🔔 회원(구독자)에게 실제로 발송을 시작하면 'true'로 바꾸세요.
  #    true = 해석글 생성 실패 시 텔레그램 발송을 막습니다(깨진 내용이 회원에게 안 감).
  #    false(지금) = 실패해도 그대로 보냅니다 — 테스트 중이라 본인이 직접 눈으로 확인하려는 용도.
  # 🆕 2026-08-22 — 'false'였다. 해석글이 없어도 텔레그램이 나가서
  #    구독자에게 **없는 페이지(404) 링크**가 발송됐다(실제 사고).
  #    이제 해석글이 없으면 무조건 막고, 운영자에게만 알린다.
  TELEGRAM_SKIP_ON_FAIL: 'true'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      # ── ⓪ 중복 발행 차단 ──
      #   오늘 날짜 리포트가 이미 저장소에 있으면 = 앞선 시도가 성공한 것
      #   → 이번 실행은 아무것도 하지 않고 조용히 끝낸다 (텔레그램 중복 발송 방지)
      - name: 오늘 이미 발행했는지 확인
        id: guard
        run: |
          TODAY=$(date +%Y%m%d)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=yes" >> $GITHUB_OUTPUT
            echo "🔘 수동 실행 — 중복 확인을 건너뛰고 새로 만듭니다."
          elif [ -f "archive/report_${TODAY}.json" ]; then
            # ⚠️ 예전엔 report_*.html 존재 여부로 판단했다.
            #    문제: 해석글(Claude) 생성이 실패해도 build_html.py는 html을 만들어버려서,
            #    한 번 실패하면 오늘 남은 재시도(2~4차)가 전부 "이미 발행됨"으로 착각하고
            #    스스로 건너뛰었다 — 하루 종일 깨진 리포트가 방치되는 원인.
            #    그래서 기준을 "해석글(json)까지 성공적으로 만들어졌는가"로 바꾼다.
            #
            # 🆕 2026-08-26 — 발행됐어도 **데이터가 미완이면 다시 만든다.**
            #    16:50로 당기면서 생긴 문제: 이른 회차가 잠정 수급으로 성공하면
            #    남은 회차가 전부 스킵되어 **잠정 숫자가 하루 종일 라이브에 남는다.**
            #    collect_data.py가 data_*.json에 남긴 '데이터완전성'을 보고 판단한다.
            # ⚠️ YAML 안에서는 여러 줄 파이썬을 쓰지 않는다(들여쓰기가 깨진다).
            #    한 줄짜리로 짜서 grep으로 판정한다.
            INCOMPLETE=no
            if grep -q '"완전": false' "archive/data_${TODAY}.json" 2>/dev/null; then
              INCOMPLETE=yes
            fi
            # 🆕 2026-08-26 — 승계본(전날 해석글)으로 발행된 날은 **아직 끝난 게 아니다.**
            #   뒤 회차가 진짜 해석글을 만들어 덮어써야 하므로 다시 돌린다.
            #   inherit_report.py가 남긴 "승계원본" 필드로 판정한다.
            if grep -q '"승계원본"' "archive/report_${TODAY}.json" 2>/dev/null; then
              INCOMPLETE=yes
              echo "🔁 오늘 해석글이 **전날 승계본**입니다 — 진짜 해석글로 다시 시도합니다."
            fi
            if [ "$INCOMPLETE" = "yes" ]; then
              echo "run=yes" >> $GITHUB_OUTPUT
              echo "🔁 이미 발행됐지만 **미완(데이터 또는 승계본)**이라 다시 만듭니다."
            else
              echo "run=no" >> $GITHUB_OUTPUT
              echo "⏭️ 오늘 해석글까지 정상 완료된 발행이 이미 있습니다. 이번 시도는 건너뜁니다."
            fi
          else
            echo "run=yes" >> $GITHUB_OUTPUT
            echo "▶️ 오늘 아직 정상 발행 전입니다 — 이번 시도를 진행합니다(재시도 포함)."
          fi

      - name: 파이썬 준비
        if: steps.guard.outputs.run == 'yes'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        if: steps.guard.outputs.run == 'yes'
        run: pip install -r requirements.txt
      - name: 과거 발행물 정리 (archive 폴더로)
        if: steps.guard.outputs.run == 'yes'
        run: |
          # 날짜별 원본(json)을 archive/ 로 모은다. 루트에 매일 쌓이면
          # 정작 중요한 .py 파일이 묻히기 때문. HTML은 링크 보존을 위해 루트에 둔다.
          mkdir -p archive
          shopt -s nullglob
          for f in data_*.json report_*.json; do
            [ -f "$f" ] && git mv -f "$f" archive/ 2>/dev/null || mv -f "$f" archive/
          done
          echo "archive 파일 수: $(ls archive | wc -l)"


      # ── ① 숫자 수집 ──
      - name: 데이터 수집
        id: collect
        if: steps.guard.outputs.run == 'yes'
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
        run: python collect_data.py

      # 🆕 2026-08-27 (2차) — GitHub 무료 예약이 밀려 16:50 예약이 다음 날
      #    새벽에 실행된 사고가 있었다. 그럴 경우 코드가 "오늘"을 다음 날로
      #    착각해, 아직 열리지도 않은 시장을 대상으로 잠정 데이터를 만들어
      #    **텔레그램까지 그대로 나갈 뻔했다**(완전성 검사가 텔레그램 발송
      #    조건에 없었다). 이 단계가 data_*.json의 "정상시각" 값을 읽어
      #    뒤 텔레그램 단계의 조건에 연결한다. 발행 자체는 막지 않는다
      #    (기존 원칙 유지) — 텔레그램만 건너뛴다.
      # 🔴 2026-08-29 — GitHub Actions의 id는 영문/숫자/_/- 만 허용(알파벳
      #    또는 _로 시작). 한글 id("시각검사")가 여기 있어서 워크플로 파일
      #    자체가 무효 처리되고 있었다(Invalid workflow file 에러, 실측
      #    확인). daily.yml이 8/28 19:32에 마지막으로 수정된 뒤 계속 이
      #    상태였을 것으로 보인다 — 다행히 그 뒤로 국내 시장이 열린
      #    거래일이 없어(주말) 실제 발행 누락 피해는 없었다.
      #    표시 이름(name)은 한글 그대로 둬도 된다 — 문제는 id뿐이다.
      - name: 실행 시각 정상 여부 확인
        id: time_check
        if: steps.guard.outputs.run == 'yes'
        run: |
          TODAY=$(date +%Y%m%d)
          if grep -q '"정상시각": false' "archive/data_${TODAY}.json" 2>/dev/null; then
            echo "normal=no" >> "$GITHUB_OUTPUT"
            echo "🔴 실행 시각이 비정상입니다 — 뒤 텔레그램 단계를 건너뜁니다."
          else
            echo "normal=yes" >> "$GITHUB_OUTPUT"
          fi

      # 🆕 2026-08-27 (2차) — 비정상 시각이면 형에게만 알린다(구독자는 무관).
      - name: 예약 지연 알림 (운영자 전용)
        if: steps.guard.outputs.run == 'yes' && steps.time_check.outputs.normal == 'no'
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: python notify_admin.py abnormal_time

      # 🆕 2026-08-22 — 수집이 죽으면 그 뒤는 전부 무의미하다. 운영자에게만 알리고 끝낸다.
      - name: 수집 실패 알림 (운영자 전용)
        if: failure() && steps.guard.outputs.run == 'yes'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: python notify_admin.py collect_fail

      # ══════════════════════════════════════════════════════════
      # 🚨 휴장 가드 — 2026-08-22 신설, 2026-08-26 HO 지시로 **잠시 꺼둠**
      #   원래 목적: cron은 월~금에만 돌지만 **달력상 평일인데 장이 안 서는 날**이
      #   있다(임시공휴일·선거일·임시휴장). 그날 그냥 돌면 지수 0%·수급 0원인
      #   엉터리 데이터로 Claude가 글까지 써서(=과금) 구독자에게 나간다.
      #
      #   ⚠️ 2026-08-26 HO 지시 — "무료는 지금 나한테만 가니까 그냥 다 보내줘.
      #      드롭다운(휴장·장중에도 발행)도 없애줘. 유료 완전자동화 때 다시 켜자."
      #      [WHY] 지금은 구독자가 없고 텔레그램이 운영자 본인에게만 간다.
      #            매번 막혀서 "안 된다"고 뜨는 게 오히려 확인을 방해했다.
      #   → HOLIDAY_FLAG는 **여전히 만들고 로그에 남긴다**(collect_data.py는
      #     그대로 둔다 — 나중에 다시 켤 때 코드 변경이 필요 없게).
      #     다만 이 단계는 그걸로 **막지 않는다.** closed는 항상 'no'.
      #   🔴 되돌릴 때: 아래 always no 로직을 지우고, elif 분기(휴장이면 closed=yes)를
      #      되살리면 된다. 이 블록 위에 원래 로직을 주석으로 남겨뒀다.
      #     [원래 로직]
      #       HOLIDAY_FLAG 있으면 closed=yes(이후 단계 스킵) · 없으면 closed=no
      - name: 휴장 여부 확인
        id: holiday
        if: steps.guard.outputs.run == 'yes'
        run: |
          echo "closed=no" >> "$GITHUB_OUTPUT"
          if [ -f "HOLIDAY_FLAG" ]; then
            echo "📌 휴장/장중으로 보이지만 지금은 항상 발행합니다 (HO 지시, 2026-08-26)"
            echo "   사유: $(cat HOLIDAY_FLAG)"
          else
            echo "✅ 정상 거래일"
          fi

      - name: 휴장 알림 (운영자 전용)
        if: steps.guard.outputs.run == 'yes' && steps.holiday.outputs.closed == 'yes'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: python notify_admin.py holiday "${{ steps.holiday.outputs.reason }}"

      # ── ② 해석글 생성 (실패해도 다음 단계로) ──
      # 💰 유일하게 돈이 드는 단계.
      #    수동 실행에서 '재사용'을 고르면 통째로 건너뛰고 기존 해석글을 그대로 쓴다.
      - name: 해석글 생성 (Claude)
        if: >-
          steps.guard.outputs.run == 'yes' &&
          steps.holiday.outputs.closed != 'yes' &&
          (github.event_name != 'workflow_dispatch' ||
           startsWith(inputs.claude, '새로 생성'))
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_report.py

      # ── ③ HTML 생성 ──
      - name: 이번 실행 모드 안내
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "🔘 수동 실행 — Claude: ${{ inputs.claude }} / 텔레그램: ${{ inputs.telegram }}"
          else
            echo "⏰ 자동 실행 — 정식 발행 (Claude 생성 + 텔레그램 발송)"
          fi

      # ── ②-b 해석글 승계 (2026-08-26 신설) ──
      #   오늘 해석글이 없으면 **직전 거래일 글을 그대로 승계**한다.
      #   [WHY] 예전엔 해석글이 없으면 텔레그램·index.html이 통째로 막혀
      #         하루가 비었다. 숫자·표는 전부 정상인데도 그랬다.
      #         발행은 하되, 화면에 "○/○ 글"이라고 반드시 밝힌다.
      #   ⚠️ 오늘 해석글이 이미 있으면 스크립트가 스스로 아무것도 하지 않는다.
      #   ⚠️ 승계본에는 "승계원본" 필드가 박혀, 위 가드가 뒤 회차에서
      #      진짜 해석글로 덮어쓰도록 다시 돌린다.
      - name: 해석글 승계 (없으면 전날 글)
        id: inherit
        if: steps.guard.outputs.run == 'yes' && steps.holiday.outputs.closed != 'yes'
        continue-on-error: true
        run: python inherit_report.py | tee /tmp/inherit.log
      - name: 승계 여부 판정
        id: inherit_check
        if: steps.guard.outputs.run == 'yes' && steps.holiday.outputs.closed != 'yes'
        run: |
          if grep -q "inherited=yes" /tmp/inherit.log 2>/dev/null; then
            echo "done=yes" >> "$GITHUB_OUTPUT"
          else
            echo "done=no" >> "$GITHUB_OUTPUT"
          fi

      # ⚠️ '재사용'인데 오늘 해석글이 아예 없으면 핵심편이 빈 채로 나간다.
      #    그 상태로 발행되면 구독자가 "핵심편이 사라졌다"고 느낀다 → 미리 크게 경고한다.
      - name: 해석글 없음 경고
        if: steps.guard.outputs.run == 'yes' && steps.holiday.outputs.closed != 'yes'
        run: |
          TODAY=$(date +%Y%m%d)
          if [ ! -f "archive/report_${TODAY}.json" ]; then
            echo "::warning title=핵심편 없음::오늘 해석글(archive/report_${TODAY}.json)이 없습니다. 이대로 발행하면 ⏱️핵심편이 통째로 빠집니다. 'Claude 해석글 = 새로 생성'으로 다시 실행하세요."
          else
            echo "✅ 오늘 해석글 확인 — 핵심편이 정상 포함됩니다."
          fi

      - name: 리포트 HTML 생성
        if: steps.guard.outputs.run == 'yes' && steps.holiday.outputs.closed != 'yes'
        run: |
          TODAY=$(date +%Y%m%d)
          python build_html.py
          # ⚠️ 해석글(핵심편)이 없으면 index.html을 건드리지 않는다 (2026-08-19).
          #    재사용 모드로 돌렸을 때 라이브 첫 화면이 '핵심편 없는 버전'으로
          #    덮어써지던 사고를 막는다. 화면 확인은 report_YYYYMMDD.html로 하면 된다.
          if [ -f "archive/report_${TODAY}.json" ]; then
            cp "report_${TODAY}.html" index.html
            echo "✅ index.html 갱신 — 핵심편 포함"
          else
            echo "::notice title=index.html 보호::해석글이 없어 index.html을 그대로 두었습니다. 오늘 화면은 report_${TODAY}.html 로 확인하세요. (정식 발행하려면 'Claude 해석글 = 새로 생성')"
          fi
      # 🆕 2026-08-26 — 잠정 데이터로 발행됐으면 운영자에게만 알린다.
      #   ⚠️ 구독자에게는 아무 티도 내지 않는다. 리포트는 정상 발행됐고,
      #      다음 회차가 확정본으로 덮어쓰기 때문이다.
      - name: 잠정 데이터 알림 (운영자 전용)
        if: steps.guard.outputs.run == 'yes' && steps.holiday.outputs.closed != 'yes'
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          TODAY=$(date +%Y%m%d)
          if grep -q '"완전": false' "archive/data_${TODAY}.json" 2>/dev/null; then
            REASON=$(cat INCOMPLETE_FLAG 2>/dev/null || echo "사유 미상")
            python notify_admin.py incomplete "$REASON"
          else
            echo "✅ 데이터 완전 — 잠정 알림 없음"
          fi

      - name: 공유 썸네일 생성
        if: steps.guard.outputs.run == 'yes' && steps.holiday.outputs.closed != 'yes'
        run: python make_thumb.py

      # ── 안전장치: 해석글 실패 시 텔레그램만 스킵 ──
      #   사이트(Pages)는 "숫자만으로도 발행" 원칙대로 그대로 올라간다(로직문서 원칙).
      #   단, 구독자에게 나가는 텔레그램은 "충전 후 자동 생성" 같은 문구가
      #   그대로 노출되면 안 되므로 여기서 막는다.
      - name: 해석글 성공 여부 확인
        id: interp_check
        if: steps.guard.outputs.run == 'yes' && steps.holiday.outputs.closed != 'yes'
        run: |
          TODAY=$(date +%Y%m%d)
          if [ -f "archive/report_${TODAY}.json" ]; then
            echo "ok=yes" >> "$GITHUB_OUTPUT"
            echo "✅ 해석글 확인됨 — 텔레그램 정상 발송"
          else
            echo "ok=no" >> "$GITHUB_OUTPUT"
            echo "❌ 해석글 없음 — 텔레그램 발송을 건너뜁니다. (사이트는 숫자만으로 발행됨)"
            echo "   👉 Actions 탭에서 '해석글 생성 (Claude)' 스텝 로그의 원인을 확인하세요."
          fi

      # ── ④ 자동 커밋 → Pages 배포 ──
      - name: 자동 커밋 & 배포
        # 🆕 2026-08-22 — 휴장일엔 커밋도 하지 않는다.
        #    지수 0%·수급 0원인 data_*.json이 archive에 남으면
        #    20일 누적 통계·섹터 성적표가 그 0값에 오염된다.
        if: steps.guard.outputs.run == 'yes' && steps.holiday.outputs.closed != 'yes'
        run: |
          git config user.name "chartpro-bot"
          git config user.email "bot@chartpro.local"
          # ⚠️ 누적 파일은 반드시 여기 있어야 한다. 빠지면 매일 초기화된다.
          #    return_sector_log.json = 돌아올 섹터 예보 기록(적중률 채점용, 2026-08-21 추가)
          #    watch_tally.json        = 관전포인트 예보 누적 승패(2026-08-22 추가)
          git add -A archive index.html report_*.html flow_history.json market_history.json \
                  return_sector_log.json watch_tally.json core_accum_log.json strata_history.json \
                  stock_flow_history.json stock_profile.json biz_report_raw.json stock_news_raw.json corp_stockcode.json corp_map.json thumb/*.png || true
          git commit -m "자동 발행: $(date +%Y-%m-%d)" || echo "변경사항 없음"
          # 🔴 2026-08-28 — 몰아 모으기(enrich.yml)가 같은 저장소에 push하다가
          #   실패하는 사고를 겪었다. 이제 cron-job.org 3개(18:07·18:27·18:47)가
          #   짧은 간격으로 걸려 있어, 앞 회차가 늦게 끝나면 뒤 회차와 겹칠 수
          #   있다. push가 거부되면 최신을 받아와 합친 뒤 재시도한다.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash || true
            if git push; then
              echo "✅ 저장 성공 (시도 $i회)"
              break
            fi
            echo "⚠️ push 거부됨 — 재시도 ($i/5)"
            sleep 5
          done

      # 🆕 2026-08-22 — 해석글이 없으면 구독자 발송을 막고 운영자에게만 알린다.
      - name: 해석글 없음 알림 (운영자 전용)
        if: >-
          steps.guard.outputs.run == 'yes' &&
          steps.holiday.outputs.closed != 'yes' &&
          steps.interp_check.outputs.ok != 'yes'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: python notify_admin.py no_interp

      # 🆕 2026-08-26 — 전날 글로 승계 발행했으면 운영자에게만 알린다.
      #   ⚠️ 구독자에게는 화면 배너로 이미 밝혔다. 여기서는 운영자가
      #      "오늘 Claude 생성이 왜 실패했는지"를 확인하도록 알린다.
      - name: 해석글 승계 알림 (운영자 전용)
        if: >-
          steps.guard.outputs.run == 'yes' &&
          steps.holiday.outputs.closed != 'yes' &&
          steps.inherit_check.outputs.done == 'yes'
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: python notify_admin.py inherited "오늘 해석글 생성 실패 — 직전 거래일 글로 발행"

      # ── Pages 배포 전파 대기 ──
      #   git push 직후 바로 텔레그램을 보내면, GitHub Pages가 아직 새 페이지를
      #   배포 중일 수 있다(수십 초 소요). 그 틈에 텔레그램이 링크를 미리 크롤링하면
      #   옛 버전이나 "썸네일 없음" 상태를 그대로 캐시해버려 나중에도 안 바뀐다.
      - name: Pages 배포 대기
        if: >-
          steps.guard.outputs.run == 'yes' &&
          steps.holiday.outputs.closed != 'yes' &&
          (env.TELEGRAM_SKIP_ON_FAIL != 'true' || steps.interp_check.outputs.ok == 'yes') &&
          (github.event_name != 'workflow_dispatch' ||
           startsWith(inputs.telegram, '보냄'))
        run: sleep 45

      # ── ⑤ 텔레그램 알림 ──
      # 📮 텔레그램 자체는 무료지만, 테스트 알림이 구독자에게 가면 안 된다.
      - name: 텔레그램 알림 전송
        if: >-
          steps.guard.outputs.run == 'yes' &&
          steps.holiday.outputs.closed != 'yes' &&
          steps.time_check.outputs.normal != 'no' &&
          (env.TELEGRAM_SKIP_ON_FAIL != 'true' || steps.interp_check.outputs.ok == 'yes') &&
          (github.event_name != 'workflow_dispatch' ||
           startsWith(inputs.telegram, '보냄'))
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify_telegram.py
