name: 몰아 모으기 (기업 프로필·사업보고서·종목뉴스)

# ⚠️ 이 workflow는 발행(daily.yml)과 완전히 분리돼 있다.
#    수동(workflow_dispatch)으로만 돈다 — 예약 실행 없음.
#    발행이 도는 중(16:50~18:20 사이)에는 되도록 실행하지 않는다.
#    같은 json 파일을 동시에 건드리면 git push가 충돌할 수 있다.
on:
  workflow_dispatch:
    inputs:
      profile_quota:
        description: "기업 프로필 — 이번에 새로 채울 종목 수"
        default: "300"
      biz_quota:
        description: "사업보고서 — 이번에 받을 건수"
        default: "40"
      news_quota:
        description: "종목뉴스 — 이번에 긁을 종목 수"
        default: "150"

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # 넉넉히 5시간 — 발행과 달리 서두를 이유가 없다
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        # ⚠️ collect_data.py는 requests만 쓰는 게 아니라 pandas·yfinance 등도
        #    최상단에서 import한다. requirements.txt를 그대로 설치해야
        #    "ModuleNotFoundError"로 죽지 않는다.
        run: pip install -r requirements.txt --quiet

      - name: 몰아 모으기 실행
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          CP_PROFILE_QUOTA: ${{ github.event.inputs.profile_quota }}
          CP_BIZ_QUOTA: ${{ github.event.inputs.biz_quota }}
          CP_SNEWS_QUOTA: ${{ github.event.inputs.news_quota }}
        run: python catchup_enrich.py

      # 🔴 2026-08-28 사고 수정 — 몰아 모으기가 2시간 넘게 도는 사이,
      #    형이 그날 저녁 발행(daily.yml)을 수동으로 먼저 완료시켜 같은
      #    저장소에 커밋했다. 몰아 모으기가 뒤늦게 push하려 하자 "네가
      #    시작한 뒤로 다른 커밋이 먼저 들어왔다"며 거부당해(rejected),
      #    2시간 16분 동안 모은 결과가 통째로 저장 안 되고 날아갈 뻔했다.
      #    [WHY] git push는 "내가 받아온 시점 이후로 아무도 안 건드렸을 때만"
      #          성공한다. 오래 도는 작업일수록 그 사이에 발행이 끼어들
      #          가능성이 높다 — 특히 이 작업은 5시간까지 걸릴 수 있다.
      #    → 실패하면 **최신 커밋을 받아와 합친 뒤(rebase) 다시 시도**한다.
      #      최대 5번, 매번 몇 초씩 쉬면서 — 여러 workflow가 동시에 끝나도
      #      순서대로 안전하게 쌓이게 한다.
      - name: 결과 저장 (git commit)
        run: |
          git config user.name "chartpro-bot"
          git config user.email "bot@chartpro.local"
          # 🔴 2026-08-29 (2차) — 실측으로 심각한 사고 확인.
          #    biz_report_fail.json·stock_news_fail.json은 "실패가 있을 때만"
          #    생기는 파일이다. 한쪽만 실패가 0건이면 그 파일이 아예 안 만들어지고,
          #    git add에 없는 파일이 하나라도 섞이면 **그 한 줄 전체가 실패해서
          #    나머지 멀쩡한 파일까지 통째로 안 올라간다**(pathspec 에러, exit 128).
          #    2>/dev/null || true가 이걸 조용히 삼켜 "변경 없음"으로 보였지만
          #    실제론 그날 모은 것 전부(프로필·사업보고서·종목뉴스)가 커밋 자체가
          #    안 되고 통째로 날아갔다(31분 실행분 소실, 2026-08-29 실측).
          #    → 파일 하나씩 따로 add해서, 없는 파일 하나가 나머지를 물귀신처럼
          #      끌고 들어가지 않게 한다.
          for f in stock_profile.json corp_map.json corp_stockcode.json \
                   biz_report_raw.json stock_news_raw.json \
                   biz_report_fail.json stock_news_fail.json; do
            git add "$f" 2>/dev/null || true
          done
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "🚀 몰아 모으기 $(date +%Y-%m-%d\ %H:%M)"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "✅ 저장 성공 (시도 $i회)"
              exit 0
            fi
            echo "⚠️ push 거부됨 — 그 사이 다른 커밋이 들어온 것 같습니다. 받아와서 다시 시도합니다 ($i/5)"
            git pull --rebase --autostash
            sleep 5
          done
          echo "❌ 5번 시도해도 저장 실패 — 모아둔 결과는 이번 실행 로그에 없고 사라집니다"
          echo "   (다음 «몰아 모으기»를 다시 돌리면 그 종목들부터 이어서 채워집니다)"
          exit 1
