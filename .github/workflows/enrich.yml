name: 몰아 모으기 (기업 프로필·사업보고서·종목뉴스)

# ⚠️ 이 workflow는 발행(daily.yml)과 완전히 분리돼 있다.
#    발행이 도는 중(16:50~18:20 사이)에는 되도록 실행하지 않는다.
#    같은 json 파일을 동시에 건드리면 git push가 충돌할 수 있다.
#
# 🔴 2026-09-07 — 새벽 예약 실행을 추가한다.
#   [왜] 종목뉴스가 하루 60종목씩만 갱신돼 3,962종목을 한 바퀴 도는 데
#        66일이 걸렸다. 그래서 구독자가 어떤 종목을 담든 대부분 «8월 기사»가
#        떴다. 구독자의 관심종목은 브라우저에만 있어 서버가 알 수 없으므로,
#        **전 종목을 자주 갱신하는 것 말고는 방법이 없다.**
#   [왜 여기인가] 발행(daily.yml)은 18:07에 시작해 43분이 걸린다. 거기에
#        대량 뉴스 수집을 얹으면 발행이 더 늦어진다. 반면 이 워크플로는
#        timeout 5시간에 발행과 분리돼 있어 **아무리 오래 걸려도 상관없다.**
#   [효과] 하루 1,000종목이면 약 4일에 전 종목 한 바퀴 → 기사가 «최대 4일 전».
#        소요는 약 22분인데, 새벽 3시라 아무에게도 영향이 없다.
#   ⚠️ 발행 시간(18:07)과 겹치지 않게 새벽 3시(KST)로 잡았다.
#      cron은 UTC 기준이라 KST 03:00 = UTC 18:00(전날).
on:
  schedule:
    - cron: "0 18 * * 0-4"   # UTC 18:00 = KST 익일 03:00 (월~금 새벽)
  workflow_dispatch:
    inputs:
      profile_quota:
        description: "기업 프로필 — 이번에 새로 채울 종목 수"
        default: "300"
      biz_quota:
        description: "사업보고서 — 이번에 받을 건수"
        default: "40"
      news_quota:
        description: "종목뉴스 — 이번에 긁을 종목 수"
        default: "150"
      bizport_quota:
        description: "사업 포트폴리오(매출 비중, Claude 파싱) — 이번에 처리할 종목 수"
        default: "20"
      retry_failed:
        description: "사업보고서 실패목록을 180일 기다리지 않고 오늘 우선 재시도할까요?"
        type: choice
        default: "no"
        options:
          - "no"
          - "yes"
      port_retry_failed:
        description: "사업 포트폴리오(기업분석) 실패목록을 30일 기다리지 않고 오늘 재시도할까요?"
        type: choice
        default: "no"
        options:
          - "no"
          - "yes"
      desc_quota:
        description: "기업 설명(무엇을 만들어 파는 회사인지, Claude 파싱) — 이번에 처리할 종목 수"
        default: "20"
      desc_retry_failed:
        description: "기업 설명 실패목록을 30일 기다리지 않고 오늘 재시도할까요?"
        type: choice
        default: "no"
        options:
          - "no"
          - "yes"

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # 넉넉히 5시간 — 발행과 달리 서두를 이유가 없다
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        # ⚠️ collect_data.py는 requests만 쓰는 게 아니라 pandas·yfinance 등도
        #    최상단에서 import한다. requirements.txt를 그대로 설치해야
        #    "ModuleNotFoundError"로 죽지 않는다.
        run: pip install -r requirements.txt --quiet

      - name: 몰아 모으기 실행
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          # 🆕 2026-08-31 — 사업 포트폴리오 파서가 Claude API를 쓴다.
          #    daily.yml과 시크릿 이름을 통일했다(같은 키 재사용).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 🔴 2026-09-07 — 예약(cron) 실행에는 inputs가 **없다**(빈 문자열).
          #    그대로 두면 quota가 0으로 읽혀 아무것도 안 모은다.
          #    || 로 «예약 실행용 기본값»을 준다. 수동 실행이면 입력값이 이긴다.
          #    ⚠️ 뉴스 600종목 ≈ 13분. 7일이면 전 종목(3,962)을 한 바퀴 돈다.
          #    🔴 2026-09-07 1000 → 600으로 낮춤. [왜] 저장소를 private로
          #       바꾸면 GitHub Actions가 유료(Pro 2,000분/월)가 되는데,
          #       국내 발행(946분) + 미국 발행 예정(330~440분)까지 더하면
          #       1000종목(484분)으로는 한도를 넘길 위험이 있다. 600이면
          #       290분이라 여유가 남는다. 기사가 «최대 4일 전»이든
          #       «최대 7일 전»이든 체감 차이는 크지 않다.
          CP_PROFILE_QUOTA: ${{ github.event.inputs.profile_quota || '0' }}
          CP_BIZ_QUOTA: ${{ github.event.inputs.biz_quota || '30' }}
          CP_SNEWS_QUOTA: ${{ github.event.inputs.news_quota || '600' }}
          CP_BIZPORT_QUOTA: ${{ github.event.inputs.bizport_quota || '0' }}
          CP_RETRY_FAILED: ${{ github.event.inputs.retry_failed || 'no' }}
          CP_PORT_RETRY_FAILED: ${{ github.event.inputs.port_retry_failed || 'no' }}
          CP_DESC_QUOTA: ${{ github.event.inputs.desc_quota || '0' }}
          CP_DESC_RETRY_FAILED: ${{ github.event.inputs.desc_retry_failed || 'no' }}
        run: python catchup_enrich.py

      # 🔴 2026-08-28 사고 수정 — 몰아 모으기가 2시간 넘게 도는 사이,
      #    형이 그날 저녁 발행(daily.yml)을 수동으로 먼저 완료시켜 같은
      #    저장소에 커밋했다. 몰아 모으기가 뒤늦게 push하려 하자 "네가
      #    시작한 뒤로 다른 커밋이 먼저 들어왔다"며 거부당해(rejected),
      #    2시간 16분 동안 모은 결과가 통째로 저장 안 되고 날아갈 뻔했다.
      #    [WHY] git push는 "내가 받아온 시점 이후로 아무도 안 건드렸을 때만"
      #          성공한다. 오래 도는 작업일수록 그 사이에 발행이 끼어들
      #          가능성이 높다 — 특히 이 작업은 5시간까지 걸릴 수 있다.
      #    → 실패하면 **최신 커밋을 받아와 합친 뒤(rebase) 다시 시도**한다.
      #      최대 5번, 매번 몇 초씩 쉬면서 — 여러 workflow가 동시에 끝나도
      #      순서대로 안전하게 쌓이게 한다.
      - name: 결과 저장 (git commit)
        run: |
          git config user.name "chartpro-bot"
          git config user.email "bot@chartpro.local"

          # 🔴 2026-08-29 (3차) — 실측으로 더 심각한 사고 확인.
          #    daily.yml도 이 파일들(stock_profile·biz_report_raw·stock_news_raw
          #    등)을 자기 발행 때마다 소량으로 같이 커밋한다. 몰아 모으기를
          #    연달아 돌리는 도중 daily.yml의 "자동 발행" 커밋이 먼저 들어오면,
          #    git의 줄 단위 rebase가 "CONFLICT (content)"로 막혀버렸다
          #    (실측: 17분 실행분이 이 이유로 통째로 소실). git한테 병합을
          #    맡기지 않고 merge_json_files.py로 JSON을 직접 병합한다.
          #    (heredoc으로 여기 직접 넣었다가 YAML 들여쓰기와 파이썬 최상위
          #    코드 들여쓰기 규칙이 서로 충돌해 두 번 깨진 뒤 별도 파일로
          #    분리했다 — merge_json_files.py 안의 주석 참고)
          merge_and_commit() {
            git fetch origin main
            python3 merge_json_files.py
            git reset --mixed origin/main
            for f in stock_profile.json corp_map.json corp_stockcode.json \
                     biz_report_raw.json stock_news_raw.json \
                     biz_report_fail.json stock_news_fail.json \
                     biz_portfolio.json biz_portfolio_fail.json \
                     biz_description.json biz_description_fail.json; do
              git add "$f" 2>/dev/null || true
            done
            if git diff --cached --quiet; then
              echo "변경 없음 — 커밋 생략"
              return 0
            fi
            git commit -m "🚀 몰아 모으기 $(date +%Y-%m-%d\ %H:%M)"
          }

          merge_and_commit
          for i in 1 2 3 4 5; do
            if git push; then
              echo "✅ 저장 성공 (시도 $i회)"
              exit 0
            fi
            echo "⚠️ push 거부됨 — 그 사이 다른 커밋이 들어온 것 같습니다. 병합 후 재시도합니다 ($i/5)"
            merge_and_commit
            sleep 5
          done
          echo "❌ 5번 시도해도 저장 실패 — 모아둔 결과는 이번 실행 로그에 없고 사라집니다"
          echo "   (다음 «몰아 모으기»를 다시 돌리면 그 종목들부터 이어서 채워집니다)"
          exit 1
